<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaiver Giraldo Muriel · PGC</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #0b0b0d;
    --carbon: #1b1b21;
    --oro: #c9a96e;
    --oro-claro: #ecdcb2;
    --crema: #f6f1e7;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #2a2620 0%, #121211 55%, #0a0a0a 100%);
    color: var(--crema);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 32px 16px;
    overflow-x: hidden;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ---------- Escena 3D ---------- */
  .scene {
    width: min(92vw, 560px);
    container-type: inline-size;
    perspective: 1400px;
    animation: enter 1.3s var(--ease) both;
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(50px) rotateX(20deg) scale(.92); }
    to   { opacity: 1; transform: none; }
  }
  .tilt {
    position: relative;
    width: 100%;
    aspect-ratio: 85 / 55;
    transform-style: preserve-3d;
    transition: transform .25s ease-out;
    will-change: transform;
  }
  .flip {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform 1.1s var(--ease);
    cursor: pointer;
    outline: none;
  }
  .flip.flipped { transform: rotateY(180deg); }
  .flip:focus-visible .face { box-shadow: 0 0 0 .6cqw var(--oro), 0 3cqw 8cqw rgba(0,0,0,.55); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 2.2cqw;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 3cqw 8cqw rgba(0,0,0,.55);
  }
  .back { transform: rotateY(180deg); }

  /* Luz que sigue al cursor */
  .face::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(201,169,110,.22), transparent 55%);
    opacity: 0;
    transition: opacity .4s ease;
  }
  .back::before {
    background: radial-gradient(circle at var(--mxb, 50%) var(--my, 50%), rgba(201,169,110,.28), transparent 55%);
  }
  .scene:hover .face::before { opacity: 1; }

  /* Marco dorado que se dibuja */
  .frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }
  .frame rect {
    fill: none;
    stroke: var(--oro);
    stroke-width: .35;
    stroke-opacity: .8;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }
  .front .frame rect { animation: draw 2.4s var(--ease) .5s forwards; }
  .flipped .back .frame rect { animation: draw 1.8s var(--ease) .5s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ---------- FRENTE ---------- */
  .front {
    background:
      repeating-radial-gradient(circle at 79% 50%, transparent 0 1.2cqw, rgba(201,169,110,.05) 1.2cqw 1.3cqw),
      linear-gradient(135deg, var(--negro) 0%, var(--carbon) 100%);
    color: var(--crema);
  }
  .shine {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.11) 50%, transparent 60%);
    transform: translateX(-120%);
    animation: shine 7s ease-in-out 2.2s infinite;
  }
  @keyframes shine {
    0% { transform: translateX(-120%); }
    22%, 100% { transform: translateX(120%); }
  }
  .content {
    position: absolute;
    inset: 0;
    z-index: 2;
    padding-left: 9cqw;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .mask { display: block; overflow: hidden; padding-bottom: .5cqw; }
  .nombre {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: 7.4cqw;
    line-height: 1.05;
    letter-spacing: .1cqw;
  }
  .nombre .inner {
    display: block;
    transform: translateY(115%);
    animation: slideUp 1.1s var(--ease) both;
    animation-delay: calc(.9s + var(--i) * .15s);
  }
  @keyframes slideUp { to { transform: none; } }
  .rule {
    height: .4cqw;
    width: 0;
    margin: 3.4cqw 0;
    background: linear-gradient(90deg, var(--oro), var(--oro-claro));
    animation: grow 1.1s var(--ease) 1.5s forwards;
  }
  @keyframes grow { to { width: 16cqw; } }
  .cargo {
    font-size: 2.3cqw;
    letter-spacing: .6cqw;
    text-transform: uppercase;
    color: var(--oro-claro);
    font-weight: 500;
    opacity: 0;
    animation: fade 1.2s ease 1.9s forwards;
  }
  @keyframes fade { to { opacity: 1; } }
  .empresa {
    position: absolute;
    left: 9cqw;
    bottom: 7cqw;
    z-index: 2;
    display: flex;
    align-items: baseline;
    gap: 2cqw;
    opacity: 0;
    animation: fade 1.2s ease 2.3s forwards;
  }
  .empresa b {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 4cqw;
    letter-spacing: 1cqw;
    color: var(--oro);
    font-weight: 700;
  }
  .empresa i {
    font-style: normal;
    font-size: 1.8cqw;
    letter-spacing: .6cqw;
    text-transform: uppercase;
    color: rgba(246,241,231,.5);
  }

  /* Reloj animado */
  .dial {
    position: absolute;
    right: 8cqw;
    top: calc(50% - 14cqw);
    width: 28cqw;
    height: 28cqw;
    z-index: 2;
    opacity: 0;
    animation: dialIn 1.6s var(--ease) 1.1s forwards;
  }
  @keyframes dialIn {
    from { opacity: 0; transform: scale(.55) rotate(-120deg); }
    to   { opacity: 1; transform: none; }
  }
  .dial svg { width: 100%; height: 100%; overflow: visible; }
  .hand {
    transform-box: view-box;
    transform-origin: 50px 50px;
  }
  #hs { transition: transform .35s cubic-bezier(.4, 2.6, .5, 1); }

  /* Partículas doradas */
  .dust {
    position: absolute;
    z-index: 1;
    width: .7cqw;
    height: .7cqw;
    border-radius: 50%;
    background: var(--oro);
    opacity: 0;
    animation: dust 7s ease-in-out infinite;
    animation-delay: var(--d);
  }
  @keyframes dust {
    0%   { opacity: 0; transform: translateY(0); }
    30%  { opacity: .75; }
    100% { opacity: 0; transform: translateY(-9cqw); }
  }

  /* ---------- REVERSO ---------- */
  .back {
    background:
      radial-gradient(circle at 50% 0%, #fffaf0 0%, transparent 60%),
      linear-gradient(160deg, #f9f4ea 0%, #ece3d0 100%);
    color: var(--negro);
  }
  .back-content {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .rb { opacity: 0; }
  .flipped .rb {
    animation: rise .9s var(--ease) both;
    animation-delay: calc(.55s + var(--i) * .13s);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(3cqw); }
    to   { opacity: 1; transform: none; }
  }
  .brand {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 12cqw;
    font-weight: 700;
    letter-spacing: 1.2cqw;
    line-height: 1;
    padding-left: 1.2cqw;
  }
  .brand span { color: var(--oro); }
  .sub {
    margin-top: 1.6cqw;
    font-size: 2cqw;
    letter-spacing: .8cqw;
    text-transform: uppercase;
    color: #7a6a4f;
    padding-left: .8cqw;
  }
  .sep {
    width: 14cqw;
    height: .35cqw;
    margin: 4cqw 0;
    background: linear-gradient(90deg, transparent, var(--oro), transparent);
  }
  .contacto { display: flex; flex-direction: column; gap: 2.2cqw; align-items: flex-start; }
  .contacto a {
    display: flex;
    align-items: center;
    gap: 2cqw;
    font-size: 3.3cqw;
    font-weight: 500;
    letter-spacing: .15cqw;
    color: var(--negro);
    text-decoration: none;
    position: relative;
    padding-bottom: .4cqw;
  }
  .contacto a::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: .25cqw;
    background: var(--oro);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .5s var(--ease);
  }
  .contacto a:hover::after { transform: scaleX(1); }
  .contacto svg {
    width: 4.4cqw;
    height: 4.4cqw;
    stroke: var(--oro);
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
  }

  /* ---------- Ayuda ---------- */
  .hint {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(246,241,231,.55);
    animation: pulse 2.8s ease-in-out 3s infinite, fadeIn 1s ease 2.4s both;
  }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
  @keyframes fadeIn { from { opacity: 0; } }

  /* ---------- Impresión y movimiento reducido ---------- */
  @media print, (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .nombre .inner { transform: none; }
    .rule { width: 16cqw; }
    .cargo, .empresa, .dial, .rb, .scene { opacity: 1; }
    .front .frame rect, .back .frame rect { stroke-dashoffset: 0; }
    .shine, .dust { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flip { transition-duration: .01ms; }
  }
  @media print {
    @page { size: 85mm 55mm; margin: 0; }
    body { background: #fff; display: block; padding: 0; min-height: 0; }
    .hint { display: none; }
    .scene { width: 85mm; perspective: none; }
    .tilt { transform: none !important; aspect-ratio: auto; height: auto; }
    .flip { position: static; transform: none !important; transform-style: flat; }
    .face {
      position: relative;
      inset: auto;
      width: 85mm;
      height: 55mm;
      transform: none !important;
      backface-visibility: visible;
      box-shadow: none;
      border-radius: 0;
      break-after: page;
    }
    .face::before { display: none; }
  }
</style>
</head>
<body>

  <div class="scene" id="scene">
    <div class="tilt" id="tilt">
      <div class="flip" id="flip" role="button" tabindex="0" aria-pressed="false"
           aria-label="Tarjeta de presentación de Jaiver Giraldo Muriel. Presiona para girarla.">

        <!-- FRENTE -->
        <div class="face front">
          <svg class="frame" viewBox="0 0 85 55" preserveAspectRatio="none" aria-hidden="true">
            <rect x="3" y="3" width="79" height="49" pathLength="1"/>
          </svg>
          <span class="shine"></span>

          <span class="dust" style="left:12%; top:82%; --d:0s"></span>
          <span class="dust" style="left:28%; top:90%; --d:1.4s"></span>
          <span class="dust" style="left:46%; top:86%; --d:2.8s"></span>
          <span class="dust" style="left:63%; top:92%; --d:.7s"></span>
          <span class="dust" style="left:78%; top:84%; --d:3.6s"></span>
          <span class="dust" style="left:90%; top:90%; --d:2.1s"></span>

          <div class="content">
            <div class="nombre">
              <span class="mask"><span class="inner" style="--i:0">Jaiver Giraldo</span></span>
              <span class="mask"><span class="inner" style="--i:1">Muriel</span></span>
            </div>
            <div class="rule"></div>
            <div class="cargo">Asesor de Relojes</div>
          </div>

          <div class="empresa"><b>PGC</b><i>Panamá</i></div>

          <div class="dial" aria-hidden="true">
            <svg viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="48" fill="none" stroke="#c9a96e" stroke-width="1.2"/>
              <circle cx="50" cy="50" r="45" fill="none" stroke="#c9a96e" stroke-width=".3" stroke-opacity=".6"/>
              <!-- 60 marcas de minuto -->
              <circle cx="50" cy="50" r="42" fill="none" stroke="#c9a96e" stroke-opacity=".55"
                      stroke-width="3" stroke-dasharray="0.35 4.037" transform="rotate(-90 50 50)"/>
              <!-- 12 marcas de hora -->
              <circle cx="50" cy="50" r="40" fill="none" stroke="#ecdcb2"
                      stroke-width="7" stroke-dasharray="1.3 19.64" transform="rotate(-90 50 50)"/>
              <g class="hand" id="hh"><line x1="50" y1="54" x2="50" y2="29" stroke="#ecdcb2" stroke-width="2.6" stroke-linecap="round"/></g>
              <g class="hand" id="hm"><line x1="50" y1="55" x2="50" y2="19" stroke="#ecdcb2" stroke-width="1.8" stroke-linecap="round"/></g>
              <g class="hand" id="hs">
                <line x1="50" y1="60" x2="50" y2="11" stroke="#c9a96e" stroke-width=".8" stroke-linecap="round"/>
                <circle cx="50" cy="60" r="1.6" fill="#c9a96e"/>
              </g>
              <circle cx="50" cy="50" r="2.6" fill="#c9a96e"/>
              <circle cx="50" cy="50" r=".9" fill="#0b0b0d"/>
            </svg>
          </div>
        </div>

        <!-- REVERSO -->
        <div class="face back">
          <svg class="frame frame-b" viewBox="0 0 85 55" preserveAspectRatio="none" aria-hidden="true">
            <rect x="3" y="3" width="79" height="49" pathLength="1"/>
          </svg>
          <div class="back-content">
            <div class="brand rb" style="--i:0">PGC<span>.</span></div>
            <div class="sub rb" style="--i:1">Panamá</div>
            <div class="sep rb" style="--i:2"></div>
            <div class="contacto">
              <a class="rb" style="--i:3" href="tel:+50769391907">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
                +507 6939-1907
              </a>
              <a class="rb" style="--i:4" href="https://www.instagram.com/panamagroup.pgc" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="#c9a96e"/></svg>
                @panamagroup.pgc
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <p class="hint">Toca la tarjeta para girarla</p>

<script>
(function () {
  var flip = document.getElementById('flip');
  var scene = document.getElementById('scene');
  var tilt = document.getElementById('tilt');

  function toggle() {
    flip.classList.toggle('flipped');
    flip.setAttribute('aria-pressed', flip.classList.contains('flipped'));
  }
  flip.addEventListener('click', toggle);
  flip.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });
  document.querySelectorAll('.face a').forEach(function (a) {
    a.addEventListener('click', function (e) { e.stopPropagation(); });
  });

  /* Inclinación 3D siguiendo el cursor */
  var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (fine && !reduce) {
    scene.addEventListener('mousemove', function (e) {
      var r = scene.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width;
      var y = (e.clientY - r.top) / r.height;
      tilt.style.transform = 'rotateX(' + ((0.5 - y) * 10) + 'deg) rotateY(' + ((x - 0.5) * 12) + 'deg)';
      scene.style.setProperty('--mx', (x * 100) + '%');
      scene.style.setProperty('--mxb', ((1 - x) * 100) + '%');
      scene.style.setProperty('--my', (y * 100) + '%');
    });
    scene.addEventListener('mouseleave', function () { tilt.style.transform = ''; });
  }

  /* Reloj en hora real */
  var hh = document.getElementById('hh');
  var hm = document.getElementById('hm');
  var hs = document.getElementById('hs');
  var n0 = Math.floor(Date.now() / 1000);
  var s0 = new Date().getSeconds();
  var last = -1;

  function update() {
    var n = Math.floor(Date.now() / 1000);
    if (n === last) return;
    last = n;
    var d = new Date();
    var m = d.getMinutes(), h = d.getHours() % 12, s = d.getSeconds();
    hs.style.transform = 'rotate(' + ((n - n0 + s0) * 6) + 'deg)';
    hm.style.transform = 'rotate(' + (m * 6 + s * 0.1) + 'deg)';
    hh.style.transform = 'rotate(' + (h * 30 + m * 0.5) + 'deg)';
  }
  hs.style.transition = 'none';
  update();
  void hs.getBoundingClientRect();
  hs.style.transition = '';
  setInterval(update, 250);
})();
</script>
</body>
</html>
